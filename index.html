*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #FAFBFE; display: flex; align-items: center; justify-content: center; }

.slide {
  width: min(100vw, calc(100vh * 960 / 540));
  aspect-ratio: 960 / 540;
  background: #FAFBFE;
  position: relative;
  overflow: hidden;
}
#frame { position: absolute; inset: 0; pointer-events: none; z-index: 100; border: 0 solid #fff; }

.rail { position: absolute; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
.rail-fade {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 28px;
  background: linear-gradient(to bottom, rgba(250,251,254,0), rgba(250,251,254,0.96));
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms ease;
}
.rail-fade.visible { opacity: 1; }
.rail-item {
  all: unset;
  position: relative;
  cursor: pointer;
  display: flex;
  align-items: baseline;
  box-sizing: border-box;
}
.rail-item::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  width: 1.5px; height: 58%;
  transform: translateY(-50%);
  background: #EEF0F4;
  transition: background 150ms ease;
}
.rail-item.selected::before { background: #831011; }
.rail-item:focus-visible { outline: 2px solid #831011; outline-offset: 2px; }
.rail-num {
  font-family: 'PPRadioGrotesk', Arial, sans-serif;
  font-weight: 400;
  color: #C85657;
  flex: 0 0 auto;
  transition: color 150ms ease;
}
.rail-text-wrap { display: block; }
.rail-title {
  font-family: 'PPRadioGrotesk', Arial, sans-serif;
  font-weight: 400;
  color: #831011;
  transition: color 150ms ease, font-weight 150ms ease;
}
.rail-sub {
  font-family: 'PPRadioGrotesk', Arial, sans-serif;
  font-weight: 400;
  color: #831011;
  transition: color 150ms ease, font-weight 150ms ease;
}

.detail-box {
  position: absolute;
  background: #FFFFFF;
  border: 2px solid #EEF0F4;
  box-sizing: border-box;
}
.detail-pane {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  transition: opacity 260ms cubic-bezier(.2,.7,.2,1);
  overflow-y: auto;
  overflow-x: hidden;
}
.detail-pane.active { opacity: 1; pointer-events: auto; }
.detail-fade {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 28px;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.96));
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms ease;
  border-radius: 0 0 5px 5px;
}
.detail-fade.visible { opacity: 1; }

.detail-progress-track {
  position: relative;
  background: #EEF0F4;
}
.detail-progress-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: #831011;
  transition: width 260ms cubic-bezier(.2,.7,.2,1);
}
.detail-progress-label {
  font-family: 'PPRadioGrotesk', Arial, sans-serif;
  font-weight: 400;
  color: #ADB2BA;
}

.detail-head {
  font-family: 'PPEiko', Georgia, serif;
  font-weight: 300;
  color: #831011;
}
.detail-list { list-style: none; display: flex; flex-direction: column; }
.detail-list li { display: flex; align-items: flex-start; }
.detail-dot { flex: 0 0 auto; background: #831011; clip-path: polygon(0 0, 100% 0, 100% 100%); }
.detail-text {
  font-family: 'Arial', Helvetica, sans-serif;
  font-weight: 300;
  color: #1a1a1a;
}
.detail-text strong { font-weight: 600; }
</style>
</head>
<body>
<div class="slide" id="sl">
  <div id="frame"></div>

  <div class="rail" id="rail"></div>
  <div class="rail-fade" id="rail-fade"></div>
  <div class="detail-box" id="detailBox"></div>
</div>

<script>
(function () {
  var DATA = [
    {
      num: '01', title: 'Asset allocation', sub: '- our framework for the years ahead',
      head: '01 - Asset allocation',
      bullets: [
        '<strong>Stay exposed to technology</strong> - but mind valuations and moats; dare to be contrarian',
        'Look for "AI proxies" offering superior risk/reward - companies demonstrating small margin / big effects, owned data, proven execution, NWC efficiencies, and firepower to acquire',
        '<strong>Make volatility your friend</strong> through hedge funds - exposure to biotechnology, China and Asia, shipping, and commodities',
        '<strong>Find true sources of diversification</strong> - avoiding correlation to equities is not easy in the current setting; we like royalties, distressed debt, ILS, and similar',
        '<strong>Debasement trades</strong> are not for the faint of heart - gold, bitcoin, copper, and renminbi',
        '<strong>Volatility</strong> offers opportunity - as a trade or a hedge'
      ]
    },
    {
      num: '02', title: 'Credit and fixed income', sub: '- handle with care',
      head: '02 - Credit and fixed income',
      bullets: [
        '<strong>Traditional approach is not adequate</strong> in an inflationary environment - core investment grade diversifies equities but pays too little, while high-yield credit pays well but is correlated with equities',
        '<strong>The goal is a high income drawn from genuinely different sources</strong>',
        'Credit spread, restructuring catalysts, structured subordination, royalties, insurance premia - genuinely different drivers, so they are not expected to fall together',
        '<strong>We remain opportunistic, and agile</strong> - internally we manage a flexible, tactical theme approach within the liquid and semi-liquid credit segment (CLO tranches, bank &amp; insurance capital, corporate hybrids, special situations, EM debt...)'
      ]
    },
    {
      num: '03', title: 'Equities', sub: '- play it smartly',
      head: '03 - Equities',
      bullets: [
        'Our approach to equities is Core &amp; Satellite - the latter composed of <strong>home-made baskets (AMCs)</strong> to express our thematic views in a meaningful way',
        'Stay invested and overweight, but <strong>be contrarian</strong> and think out of the box - ownership of unloved sectors (utilities, energy, pharma, food...)',
        '<strong>Proxy AI</strong> - think of beneficiaries that could see a triple whammy: increasing revenues, increasing margins, and increasing multiples in the coming years',
        'Europe is investable, more than perceived - we focus on <strong>construction and materials</strong> (i.e. European Infrastructure &amp; Reset)',
        'Technologies convergence is powerful - we approach it in a systematic manner by buying and letting compound a selection of <strong>Cape Moonshots</strong>',
        'Around the edges, we invest in copper and gold <strong>miners</strong>...'
      ]
    },
    {
      num: '04', title: 'Hedge funds', sub: '- an important role',
      head: '04 - Hedge funds',
      bullets: [
        'Our focus is on <strong>long-short equity hedge funds only</strong>, that complement our equity allocation',
        'In particular we look to use hedge funds for exposure to themes <strong>where long-only exposure is undesirable</strong> - those prone to high dispersion and low intra-stock correlation, which lends itself well to expertise in stock-picking',
        'Four predominant themes at the moment are <strong>biotechnology, China/Asia, shipping, and energy transition</strong>'
      ]
    },
    {
      num: '05', title: 'Private equity', sub: '- like antibiotics, occasionally with purpose and discipline',
      head: '05 - Private equity',
      bullets: [
        '<strong>Illiquidity has to come with a benefit</strong> - a story not available in public markets, cheaper or better protected than listed stocks',
        '<strong>Focus on profitable, growing, strong franchises</strong> or roll-ups benefiting from strong management execution and alignment',
        'Prioritise franchises operating in areas benefiting from structural tailwinds with <strong>as little cyclicality as possible</strong>',
        '<strong>Secondaries</strong> - benefiting from liquidity squeezes likely to arise from time to time - <strong>be the liquidity provider rather than taker</strong>',
        'Think - infrastructure (Jones Act tow-boat ownership), physical assets with revaluation potential (theatres, minor-league baseball), social issues (IVF clinic roll-ups), and communication &amp; crisis management'
      ]
    },
    {
      num: '06', title: 'Other elements', sub: '- a debasement play',
      head: '06 - Other elements',
      bullets: [
        'The same debasement that quietly erodes the real value of the income book\'s coupons tends to lift gold, bitcoin, and copper',
        'A currency <strong>debasement is a policy, not a forecast</strong>',
        'An additional asset class to compound real wealth - <strong>not a tactical hedge against recessions</strong> (gold\'s record depends on the inflation regime, not the recession itself)',
        '<strong>Gold</strong> anchors. <strong>Copper</strong> carries the electrification dimension. <strong>Bitcoin</strong> supplies asymmetry',
        'All reflecting <strong>scarcity - analogue, industrial, and digital</strong>',
        'We also find <strong>volatility mispriced</strong> given our outlook and the risks in the system',
        'One can see it as an <strong>attractive asymmetrical trade or a hedge</strong> for the portfolio carrying a small cost (think of house insurance)'
      ]
    }
  ];

  var sl = document.getElementById('sl');
  var state = { sel: 0 };

  function px(v, s) { return (v * s) + 'px'; }

  function buildRail(container, data) {
    container.innerHTML = '';
    data.forEach(function (item, i) {
      var btn = document.createElement('button');
      btn.className = 'rail-item';
      btn.id = 'item-' + i;
      var num = document.createElement('span');
      num.className = 'rail-num';
      num.textContent = item.num;
      var wrap = document.createElement('span');
      wrap.className = 'rail-text-wrap';
      var title = document.createElement('span');
      title.className = 'rail-title';
      title.textContent = item.title;
      wrap.appendChild(title);
      if (item.sub) {
        wrap.appendChild(document.createTextNode(' '));
        var subEl = document.createElement('span');
        subEl.className = 'rail-sub';
        subEl.textContent = item.sub;
        wrap.appendChild(subEl);
      }
      btn.appendChild(num);
      btn.appendChild(wrap);
      btn.addEventListener('click', function () {
        state.sel = i;
        applySelection();
      });
      container.appendChild(btn);
    });
  }

  function buildDetail(container, data) {
    container.innerHTML = '';
    data.forEach(function (item, i) {
      var pane = document.createElement('div');
      pane.className = 'detail-pane';
      pane.id = 'pane-' + i;

      var track = document.createElement('div');
      track.className = 'detail-progress-track';
      var fill = document.createElement('div');
      fill.className = 'detail-progress-fill';
      fill.style.width = (((i + 1) / data.length) * 100) + '%';
      track.appendChild(fill);

      var label = document.createElement('p');
      label.className = 'detail-progress-label';
      label.textContent = (i + 1) + ' of ' + data.length;

      var headParts = item.head.split(' - ');
      var headText = headParts.length > 1 ? headParts.slice(1).join(' - ') : item.head;
      var head = document.createElement('div');
      head.className = 'detail-head';
      head.textContent = headText;

      var list = document.createElement('ul');
      list.className = 'detail-list';
      item.bullets.forEach(function (b) {
        var li = document.createElement('li');
        var dot = document.createElement('span');
        dot.className = 'detail-dot';
        var text = document.createElement('span');
        text.className = 'detail-text';
        text.innerHTML = b;
        li.appendChild(dot);
        li.appendChild(text);
        list.appendChild(li);
      });

      pane.appendChild(track);
      pane.appendChild(label);
      pane.appendChild(head);
      pane.appendChild(list);
      container.appendChild(pane);
    });
    var fade = document.createElement('div');
    fade.className = 'detail-fade';
    fade.id = 'fade';
    container.appendChild(fade);
  }

  buildRail(document.getElementById('rail'), DATA);
  buildDetail(document.getElementById('detailBox'), DATA);

  var SELECTED_COLOR = '#831011';
  var UNSELECTED_COLOR = '#ADB2BA';

  function updateOverflowFade() {
    var pane = document.getElementById('pane-' + state.sel);
    var fade = document.getElementById('fade');
    if (!pane || !fade) { return; }
    var overflowing = pane.scrollHeight > pane.clientHeight + 1;
    fade.classList.toggle('visible', overflowing);
  }

  function applySelection() {
    DATA.forEach(function (item, i) {
      var btn = document.getElementById('item-' + i);
      var pane = document.getElementById('pane-' + i);
      var isSel = i === state.sel;
      pane.classList.toggle('active', isSel);
      btn.classList.toggle('selected', isSel);
      var wrap = btn.querySelector('.rail-text-wrap');
      var color = isSel ? SELECTED_COLOR : UNSELECTED_COLOR;
      var title = wrap.querySelector('.rail-title');
      title.style.color = color;
      var subEl = wrap.querySelector('.rail-sub');
      if (subEl) { subEl.style.color = color; }
      var num = btn.querySelector('.rail-num');
      num.style.color = isSel ? SELECTED_COLOR : '#C85657';
    });
    updateOverflowFade();
  }

  applySelection();

  /* ---- Layout engine (Figma px values, 960x540 canvas) ---- */
  var CANVAS = { w: 960, h: 540 };
  var M = { l: 56, r: 56, t: 40, b: 24 };
  var GRID = { railW: 380, gap: 32 };

  function scale() {
    var sw = sl.offsetWidth, shh = sl.offsetHeight;
    var sx = sw / CANVAS.w, sy = shh / CANVAS.h;

    document.getElementById('frame').style.border = (0 * sx) + 'px solid #fff';

    var gridTop = M.t, gridBottom = CANVAS.h - M.b;
    var gridH = gridBottom - gridTop;
    var railW = GRID.railW, detailW = CANVAS.w - M.l - M.r - railW - GRID.gap;
    var detailL = M.l + railW + GRID.gap;

    var rail = document.getElementById('rail');
    rail.style.left = px(M.l, sx); rail.style.top = px(gridTop, sy);
    rail.style.width = px(railW, sx); rail.style.height = px(gridH, sy);

    var railEl = document.getElementById('rail');
    var baseNumSize = 12;
    var baseTitleSize = 12;

    function applyRailSizes(mult) {
      var numSize = baseNumSize * mult, titleSize = baseTitleSize * mult;
      var padV = Math.max(4, Math.min(7, (gridH / DATA.length) * 0.24 * mult));
      DATA.forEach(function (item, i) {
        var btn = document.getElementById('item-' + i);
        btn.style.paddingTop = px(padV, sy);
        btn.style.paddingBottom = px(padV, sy);
        btn.style.paddingLeft = px(16, sx);
        btn.style.gap = px(14, sx);

        var num = btn.querySelector('.rail-num');
        num.style.fontSize = px(numSize, sx);
        num.style.width = px(26, sx);

        var title = btn.querySelector('.rail-title');
        title.style.fontSize = px(titleSize, sx);
        title.style.lineHeight = '1.3';

        var subEl = btn.querySelector('.rail-sub');
        if (subEl) { subEl.style.fontSize = px(titleSize, sx); }
      });
    }

    var mult = 1;
    var gridHReal = gridH * sy;
    applyRailSizes(mult);
    for (var fit = 0; fit < 16; fit++) {
      var fits = railEl.scrollHeight <= gridHReal + 0.5;
      if (fits || mult <= 0.7) break;
      mult *= 0.95;
      applyRailSizes(mult);
    }

    var railFade = document.getElementById('rail-fade');
    var fadeH = 28 * sy;
    railFade.style.left = px(M.l, sx); railFade.style.width = px(railW, sx);
    railFade.style.height = fadeH + 'px';
    railFade.style.top = ((gridTop + gridH) * sy - fadeH) + 'px';
    railFade.classList.toggle('visible', railEl.scrollHeight > railEl.clientHeight + 1);

    var box = document.getElementById('detailBox');
    box.style.left = px(detailL, sx); box.style.top = px(gridTop, sy);
    box.style.width = px(detailW, sx);
    box.style.borderRadius = px(5, sx);
    var padIn = 22;
    box.querySelectorAll('.detail-pane').forEach(function (pane) {
      pane.style.left = px(padIn, sx); pane.style.top = px(padIn, sy);
      pane.style.right = px(padIn, sx); pane.style.bottom = 'auto'; pane.style.height = 'auto';
    });
    box.querySelectorAll('.detail-progress-track').forEach(function (tr) {
      tr.style.width = px(detailW - padIn * 2, sx); tr.style.height = px(1, sy);
      tr.style.borderRadius = px(1, sx); tr.style.overflow = 'hidden';
      tr.style.marginBottom = px(10, sy);
    });
    box.querySelectorAll('.detail-progress-label').forEach(function (lb) {
      lb.style.fontSize = px(9, sx); lb.style.letterSpacing = '0.06em';
      lb.style.marginBottom = px(10, sy);
    });
    box.querySelectorAll('.detail-head').forEach(function (h) {
      h.style.fontSize = px(20, sx); h.style.lineHeight = '1.15';
      h.style.letterSpacing = '-0.01em';
      h.style.marginBottom = px(10, sy);
    });
    box.querySelectorAll('.detail-list').forEach(function (list) {
      list.style.gap = px(8, sy);
    });
    box.querySelectorAll('.detail-dot').forEach(function (d) {
      d.style.width = px(5.5, sx); d.style.height = px(5.5, sy);
      d.style.marginTop = px(4.5, sy); d.style.marginRight = px(8, sx);
    });
    box.querySelectorAll('.detail-text').forEach(function (t) {
      t.style.fontSize = px(9.5, sx); t.style.lineHeight = '1.45';
    });

    /* Size the card to the tallest item's actual content rather than
       stretching it to fill the whole available grid - there usually
       isn't enough copy in any one item to justify the full height. */
    var maxContentH = 0;
    box.querySelectorAll('.detail-pane').forEach(function (pane) {
      maxContentH = Math.max(maxContentH, pane.scrollHeight);
    });
    var boxH = Math.min(gridH * sy, maxContentH + padIn * 2 * sy + 6);
    box.style.height = boxH + 'px';
    box.querySelectorAll('.detail-pane').forEach(function (pane) {
      pane.style.bottom = px(padIn, sy); pane.style.height = '';
    });

    var fadeEl = box.querySelector('.detail-fade');
    if (fadeEl) { fadeEl.style.height = px(28, sy); }

    updateOverflowFade();
  }

  if (document.fonts) { document.fonts.ready.then(scale); }
  scale();
  setTimeout(scale, 200);
  setTimeout(scale, 600);
  window.addEventListener('resize', scale);
})();
</script>
</body>
</html>
